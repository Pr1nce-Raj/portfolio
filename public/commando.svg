<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Background -->
  <rect width="500" height="500" fill="#09090b"/>
  
  <!-- Tactical Grid -->
  <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
    <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#27272a" stroke-width="1"/>
  </pattern>
  <rect width="500" height="500" fill="url(#grid)"/>

  <g transform="translate(250, 220)">
    <!-- Base Body Silhouette -->
    <!-- Torso -->
    <path d="M -90 0 L 90 0 L 110 280 L -110 280 Z" fill="#18181b" stroke="#f59e0b" stroke-width="3"/>
    
    <!-- Shoulders -->
    <path d="M -140 50 C -160 100, -160 150, -130 200 L -90 150 Z" fill="#27272a" stroke="#f59e0b" stroke-width="2"/>
    <path d="M 140 50 C 160 100, 160 150, 130 200 L 90 150 Z" fill="#27272a" stroke="#f59e0b" stroke-width="2"/>

    <!-- Tactical Vest Details -->
    <rect x="-70" y="20" width="140" height="160" fill="#27272a" stroke="#f59e0b" stroke-width="2"/>
    
    <!-- Chest Rig Plates -->
    <rect x="-60" y="40" width="35" height="45" fill="#09090b" stroke="#f59e0b" stroke-width="1"/>
    <rect x="-15" y="40" width="30" height="45" fill="#09090b" stroke="#f59e0b" stroke-width="1"/>
    <rect x="25" y="40" width="35" height="45" fill="#09090b" stroke="#f59e0b" stroke-width="1"/>
    
    <!-- Ammo Pouches -->
    <rect x="-60" y="110" width="30" height="55" rx="3" fill="#09090b" stroke="#f59e0b" stroke-width="2"/>
    <rect x="-20" y="110" width="40" height="55" rx="3" fill="#09090b" stroke="#f59e0b" stroke-width="2"/>
    <rect x="30" y="110" width="30" height="55" rx="3" fill="#09090b" stroke="#f59e0b" stroke-width="2"/>

    <!-- Neck / Collar -->
    <path d="M -50 -20 L 50 -20 L 60 20 L -60 20 Z" fill="#18181b" stroke="#f59e0b" stroke-width="2"/>

    <!-- Head / Helmet -->
    <path d="M -65 -110 C -65 -200, 65 -200, 65 -110 Z" fill="#18181b" stroke="#f59e0b" stroke-width="4"/>
    <!-- Helmet Brim -->
    <path d="M -75 -110 C -85 -110, -85 -90, -65 -90 L 65 -90 C 85 -90, 85 -110, 75 -110 Z" fill="#27272a" stroke="#f59e0b" stroke-width="3"/>
    
    <!-- Face/Visor Area -->
    <path d="M -50 -90 L 50 -90 L 40 -20 L -40 -20 Z" fill="#09090b"/>
    <!-- Glowing Visor -->
    <path d="M -35 -70 L 35 -70 L 30 -40 L -30 -40 Z" fill="#f59e0b"/>
    <path d="M -20 -30 L 20 -30 L 15 -20 L -15 -20 Z" fill="#27272a"/>
    
    <!-- Right Arm (Left side of screen) holding front of gun -->
    <path d="M -130 180 L -200 240 L -170 270 L -90 200 Z" fill="#27272a" stroke="#f59e0b" stroke-width="2"/>
    
    <!-- Assault Rifle (Pointing West/Left diagonally) -->
    <g transform="translate(60, 160) rotate(-20)">
      <!-- Stock -->
      <rect x="0" y="0" width="80" height="35" fill="#18181b" stroke="#f59e0b" stroke-width="2"/>
      <!-- Body -->
      <rect x="-140" y="-10" width="140" height="45" fill="#27272a" stroke="#f59e0b" stroke-width="3"/>
      <!-- Magazine -->
      <path d="M -50 35 L -20 35 L -35 100 L -60 95 Z" fill="#18181b" stroke="#f59e0b" stroke-width="2"/>
      <!-- Grip -->
      <path d="M 10 35 L 25 35 L 20 80 L -5 75 Z" fill="#09090b" stroke="#f59e0b" stroke-width="2"/>
      <!-- Barrel & Handguard -->
      <rect x="-260" y="-5" width="120" height="25" fill="#18181b" stroke="#f59e0b" stroke-width="2"/>
      <!-- Muzzle -->
      <rect x="-300" y="0" width="40" height="15" fill="#27272a" stroke="#f59e0b" stroke-width="2"/>
      <rect x="-315" y="3" width="15" height="9" fill="#f59e0b"/>
      <!-- Scope / Optics -->
      <rect x="-90" y="-35" width="60" height="25" fill="#09090b" stroke="#f59e0b" stroke-width="2"/>
      <rect x="-105" y="-30" width="15" height="15" fill="#f59e0b"/>
      <rect x="-30" y="-30" width="10" height="15" fill="#f59e0b"/>
      <!-- Handguard Vents -->
      <line x1="-160" y1="7" x2="-240" y2="7" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6,6"/>
    </g>

    <!-- Left Arm (Right side of screen) holding grip -->
    <path d="M 130 180 L 70 230 L 40 200 L 90 150 Z" fill="#27272a" stroke="#f59e0b" stroke-width="2"/>
    
    <!-- Hands / Gloves -->
    <circle cx="-160" cy="220" r="18" fill="#f59e0b"/>
    <circle cx="65" cy="180" r="18" fill="#f59e0b"/>
  </g>
</svg>
