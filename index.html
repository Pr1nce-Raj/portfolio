  <body>
    <script>
      function displayError(msg, stack) {
        var errDiv = document.createElement('div');
        errDiv.style.cssText = 'position: fixed; top: 0; left: 0; background: red; color: white; padding: 20px; z-index: 999999; font-size: 16px; width: 100vw; height: 100vh; overflow: auto;';
        errDiv.innerHTML = '<h1>RUNTIME ERROR</h1><pre>' + msg + '<br/><br/>' + stack + '</pre>';
        document.body.appendChild(errDiv);
      }
      window.onerror = function(msg, url, line, col, error) {
        displayError(msg, error && error.stack);
      };
      var originalConsoleError = console.error;
      console.error = function() {
        originalConsoleError.apply(console, arguments);
        displayError(arguments[0], new Error().stack);
      };
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
